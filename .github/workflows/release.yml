# Builds a signed prod Android App Bundle when a version tag is pushed.
# The bundle is attached to the workflow run; upload it to the Play internal
# track from there (or add a Fastlane `supply` step once a Play service
# account exists).
#
# Repository secrets required:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      contents of app/android/app/google-services.json
#   PROD_CONFIG_JSON          contents of app/config/prod.json
#   ADMOB_APP_ID_ANDROID
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.1
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Test before building
        run: |
          for p in packages/flow_core packages/flow_solver packages/flow_levelgen; do
            (cd $p && dart test)
          done
          (cd app && flutter test)
      - name: Write secrets to files
        working-directory: app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PROD_CONFIG: ${{ secrets.PROD_CONFIG_JSON }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json
          printf '%s' "$PROD_CONFIG" > config/prod.json
          cat > android/key.properties <<PROPS
          storeFile=../upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          sed -i 's/^ *//' android/key.properties
      - name: Build app bundle
        working-directory: app
        env:
          # Gradle reads this as the ADMOB_APP_ID_ANDROID project property.
          ORG_GRADLE_PROJECT_ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: >
          flutter build appbundle --release --flavor prod
          --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: flow-sort-prod-aab
          path: app/build/app/outputs/bundle/prodRelease/*.aab
