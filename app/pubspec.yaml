name: flow_sort
description: Flow Sort — route every item to its bin.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flow_core: ^1.0.0
  flow_solver: ^1.0.0
  flow_levelgen: ^1.0.0
  flame: ^1.30.1
  flame_audio: ^2.11.8
  flutter_riverpod: ^2.6.1
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.42
  shared_preferences: ^2.5.3
  # Firebase is pinned to the last plugin line whose iOS SDK (12.9.0) is still
  # published to CocoaPods. Newer plugins need the iOS SDK via Swift Package
  # Manager; move these together when the project switches to SPM.
  firebase_core: ">=4.5.0 <4.6.0"
  firebase_analytics: 12.1.3
  firebase_crashlytics: 5.0.8
  firebase_remote_config: 6.2.0
  google_mobile_ads: ^6.0.0
  purchases_flutter: ^11.0.2
  go_router: ^17.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: any
  share_plus: ^12.0.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/audio/
